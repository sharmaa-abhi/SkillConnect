<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2B3D"/>
      <stop offset="100%" style="stop-color:#0F1922"/>
    </linearGradient>
    <linearGradient id="wrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5BF"/>
      <stop offset="100%" style="stop-color:#00B89C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Wrench icon with glow -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)" filter="url(#glow)">
    <path d="M380 132c-30-30-75-38-113-22l-70 70c-8 8-8 20 0 28l95 95c8 8 20 8 28 0l70-70c16-38 8-83-22-113l-30 30c-8 8-20 8-28 0s-8-20 0-28l30-30z" fill="url(#wrench)" opacity="0.95"/>
    <rect x="175" y="280" width="36" height="120" rx="18" transform="rotate(-45,193,340)" fill="url(#wrench)" opacity="0.95"/>
  </g>
  <!-- S letter overlay for SkillConnect branding -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="220" fill="#00E5BF" opacity="0.95">S</text>
</svg>
